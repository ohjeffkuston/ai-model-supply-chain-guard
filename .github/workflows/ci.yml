name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest
      - run: model-supply-chain-guard samples/compliant-bundle.json --now 2026-11-05T14:00:00Z --output json
