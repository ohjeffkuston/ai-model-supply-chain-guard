[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-supply-chain-guard"
version = "0.1.0"
description = "Deterministic release gate for AI model and container supply-chain evidence"
requires-python = ">=3.11"

[project.scripts]
model-supply-chain-guard = "model_supply_chain_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
